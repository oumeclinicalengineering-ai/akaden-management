<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>赤伝管理 Ver.6 シンプル試験版</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1c3450;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}header{background:#1765b1;color:white;padding:16px;font-weight:700;font-size:20px}main{max-width:950px;margin:auto;padding:16px 12px 80px}.notice{background:#fff1d3;border-radius:9px;padding:12px;font-size:13px}.panel{background:white;border:1px solid #dae3ee;border-radius:14px;padding:17px;margin:12px 0}h2{font-size:19px}input,select,textarea{font:inherit;padding:11px;border:1px solid #bac9d9;border-radius:8px;width:100%;margin:5px 0 10px}label{font-size:13px;font-weight:650}button{background:#1765b1;border:0;border-radius:8px;color:white;padding:11px 15px;font:inherit;cursor:pointer;margin:3px}button.secondary{background:#e7f1fd;color:#165a9d}button.danger{background:#a63442}button:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.hidden{display:none!important}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.muted{font-size:13px;color:#53677b}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:11px 8px;border-bottom:1px solid #e4e9f1;text-align:left;font-size:13px}th{background:#f3f7fb}.message{white-space:pre-wrap;color:#a5343c}.ok{color:#18774d}nav{position:sticky;bottom:0;background:white;border-top:1px solid #dae3ee;display:flex;justify-content:center;padding:8px}nav button{flex:1;max-width:250px}@media(max-width:500px){header{font-size:18px}.panel{padding:12px}nav button{font-size:13px;padding:12px 5px}}
</style><style>.small{font-size:12px;padding:8px 10px}@media(max-width:500px){table{min-width:0}table thead{display:none}table tr{display:block;border:1px solid #dce5ef;border-radius:10px;margin:8px 0;padding:7px}table td{display:flex;justify-content:space-between;gap:12px;padding:8px;border:0}table td::before{content:attr(data-label);font-weight:700;color:#53677b}table td:last-child{display:block;text-align:right}}</style></head><body><header>赤伝管理システム Ver.6 <small>シンプル試験版</small></header><main>
<p class="notice">⚠️ 架空データ専用の検証版です。実際の患者・スタッフ・発注情報や赤伝画像は入力しないでください。QR初回登録は未実装です。</p>
<section id="login" class="panel"><h2>初回設定・ログイン</h2><p class="muted">公開用Supabase URLと publishable/anon キーだけを入力してください。secret/service_roleキーは禁止です。設定はこのブラウザーに保存されます。</p>
<label>Supabase Project URL<input id="url" type="url" placeholder="https://xxxxx.supabase.co"></label>
<label>公開用キー<input id="key" type="text" autocomplete="off" placeholder="sb_publishable_..."></label>
<label>試験用メールアドレス<input id="email" type="email" autocomplete="username"></label>
<label>パスワード<input id="password" type="password" autocomplete="current-password"></label><button id="signIn">ログイン</button><p id="loginError" class="message" role="alert"></p></section>
<section id="app" class="hidden"><div class="panel row between"><div id="who"></div><button class="secondary" id="signOut">ログアウト</button></div>
<section id="ordersPanel" class="panel"><div class="row between"><h2>赤伝一覧</h2><p class="muted">他の端末での登録内容は「更新」で反映できます。</p><button class="secondary" id="reload">更新</button></div><div id="ordersStatus" class="muted"></div><div class="scroll"><table><thead><tr><th>管理番号</th><th>品名</th><th>発注数量</th><th>受領済</th><th>残数</th><th>操作</th></tr></thead><tbody id="ordersRows"></tbody></table></div></section>
<section id="newPanel" class="panel hidden"><h2>赤伝登録</h2><form id="newOrder"><div class="grid"><div><label>管理番号<input name="reference_no" required maxlength="100"></label></div><div><label>品名<input name="item_name" required></label></div><div><label>数量<input name="quantity" type="number" min="1" max="100000000" required></label></div><div><label>要求日<input name="request_date" type="date" required></label></div><div><label>発注日<input name="order_date" type="date"></label></div><div><label>納品予定日<input name="due_date" type="date"></label></div><div><label>部署<input name="department"></label></div><div><label>メーカー<input name="manufacturer"></label></div><div><label>型式<input name="model"></label></div><div><label>単位<input name="unit" value="個"></label></div><div><label>用途<input name="purpose"></label></div></div><button type="submit">架空の赤伝を登録</button></form></section>
<section id="receiptPanel" class="panel hidden"><h2>受領登録・履歴</h2><p id="selectedOrder"></p><form id="newReceipt"><div class="grid"><div><label>受領日<input name="p_receipt_date" type="date" required></label></div><div><label>数量<input name="p_quantity" type="number" min="1" required></label></div><div><label>受領者名（架空）<input name="p_person" required></label></div><div><label>メモ<input name="p_memo"></label></div></div><button type="submit">受領を登録</button></form><h3>受領履歴</h3><div id="receiptHistory"></div></section>
<p id="status" role="status" class="message"></p></section></main>
<nav id="navigation" class="hidden"><button id="navOrders">赤伝一覧</button><button id="navNew">新規登録</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('sv-SE');
let db=null,user=null,profile=null,orders=[],receipts=[],selected=null;
function note(msg,good=false){$('status').textContent=msg;$('status').className=good?'ok':'message'}
function view(id){for(const x of ['ordersPanel','newPanel','receiptPanel'])$(x).classList.toggle('hidden',x!==id);window.scrollTo(0,0)}
function cfg(){const url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url))throw Error('Project URLが正しくありません');if(!key||/service_role|sb_secret_/i.test(key))throw Error('公開用キーのみ入力してください');return {url,key}}
function init(){const {url,key}=cfg();db=supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'akaden-ver6-recovery-auth'}});localStorage.setItem('akaden-ver6-public-config',JSON.stringify({url,key}));db.auth.onAuthStateChange((_event,session)=>{if(!session){user=null;profile=null;$('app').classList.add('hidden');$('navigation').classList.add('hidden');$('login').classList.remove('hidden')}})}
async function boot(){try{const v=JSON.parse(localStorage.getItem('akaden-ver6-public-config')||'null');if(!v)return;$('url').value=v.url;$('key').value=v.key;init();const {data,error}=await db.auth.getUser();if(error||!data.user)return;await enter(data.user)}catch(e){$('loginError').textContent=e.message}}
async function enter(u){const {data,error}=await db.from('profiles').select('display_name,role,active').eq('user_id',u.id).single();if(error||!data?.active){await db.auth.signOut();throw Error('有効な利用者プロフィールを確認できません')}user=u;profile=data;$('who').textContent=data.display_name+'（'+(data.role==='admin'?'管理者':'スタッフ')+'）';$('login').classList.add('hidden');$('app').classList.remove('hidden');$('navigation').classList.remove('hidden');$('newReceipt').elements.p_person.value=data.display_name;$('newReceipt').elements.p_receipt_date.value=today();$('newOrder').elements.request_date.value=today();await load();view('ordersPanel')}
$('signIn').onclick=async()=>{const b=$('signIn');b.disabled=true;$('loginError').textContent='';try{if(!db)init();const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';await enter(data.user)}catch(e){$('loginError').textContent=e.message}finally{b.disabled=false}};
$('signOut').onclick=async()=>{if(db)await db.auth.signOut();note('ログアウトしました')};
const PAGE_SIZE=1000;
let loadVersion=0;
async function fetchAll(client,table){
  const rows=[];let cursor=null;
  for(;;){
    let query=client.from(table).select('*');
    if(table==='orders')query=query.eq('deleted',false);
    query=query.order('id',{ascending:true}).limit(PAGE_SIZE);
    if(cursor!==null)query=query.gt('id',cursor);
    const {data,error}=await query;
    if(error)throw error;
    if(!Array.isArray(data))throw Error('データ取得結果を確認できません。更新してください');
    for(const row of data){
      if(typeof row.id!=='string'||(cursor!==null&&row.id<=cursor))throw Error('取得順序が変わりました。更新してください');
      rows.push(row);cursor=row.id;
    }
    if(data.length<PAGE_SIZE)return rows;
  }
}
async function load(){
  const version=++loadVersion,client=db,viewer=user;
  const [nextOrders,nextReceipts]=await Promise.all([fetchAll(client,'orders'),fetchAll(client,'receipts')]);
  if(version!==loadVersion||client!==db||viewer!==user)return;
  nextOrders.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))||a.id.localeCompare(b.id));
  orders=nextOrders;receipts=nextReceipts;renderOrders();
}
function renderOrders(){const rows=orders.map(o=>{const got=receipts.filter(r=>r.order_id===o.id).reduce((n,r)=>n+Number(r.quantity),0);return '<tr><td data-label="管理番号">'+safe(o.reference_no)+'</td><td data-label="品名">'+safe(o.item_name)+'</td><td data-label="発注数量">'+o.quantity+'</td><td data-label="受領済">'+got+'</td><td data-label="残数">'+Math.max(0,o.quantity-got)+'</td><td><button class="secondary small" data-open="'+safe(o.id)+'">受領・履歴</button><button class="secondary small" data-edit-order="'+safe(o.id)+'">修正</button><button class="danger small" data-cancel-order="'+safe(o.id)+'">取消</button></td></tr>'});$('ordersRows').innerHTML=rows.join('')||'<tr><td colspan="6">赤伝はありません</td></tr>';$('ordersStatus').textContent=orders.length+'件'}
$('ordersRows').onclick=async e=>{const id=e.target.dataset.open||e.target.dataset.editOrder||e.target.dataset.cancelOrder;if(!id)return;if(e.target.dataset.open)return openOrder(id);const o=orders.find(x=>x.id===id);if(!o)return;if(e.target.dataset.cancelOrder){if(!confirm('この架空の赤伝を取消しますか？'))return;try{const {error}=await db.from('orders').update({deleted:true}).eq('id',id).select('id').single();if(error)throw error;await load();note('赤伝を取消しました',true)}catch(err){note('取消できません：'+err.message)}return}const name=prompt('品名',o.item_name);if(name===null||!name.trim())return;const got=receipts.filter(r=>r.order_id===o.id).reduce((n,r)=>n+Number(r.quantity),0);const q=prompt('発注数量（受領済 '+got+' 以上）',o.quantity);if(q===null||!/^\d+$/.test(q)||!Number.isSafeInteger(Number(q))||Number(q)<1||Number(q)>100000000||Number(q)<got)return note('発注数量は受領済数量以上にしてください（1～100000000の整数）');const orderDate=prompt('発注日（YYYY-MM-DD、空欄可）',o.order_date||'');if(orderDate===null||orderDate&&!/^\d{4}-\d{2}-\d{2}$/.test(orderDate))return note('発注日を確認してください');try{const {error}=await db.from('orders').update({item_name:name.trim(),quantity:Number(q),order_date:orderDate||null}).eq('id',id).select('id').single();if(error)throw error;await load();note('赤伝を修正しました',true)}catch(err){note('修正できません：'+err.message)}};
function openOrder(id){selected=orders.find(o=>o.id===id);if(!selected)return;$('selectedOrder').textContent=selected.reference_no+' / '+selected.item_name;renderHistory();view('receiptPanel')}
function renderHistory(){const rs=receipts.filter(r=>r.order_id===selected.id);$('receiptHistory').innerHTML=rs.map(r=>{const allowed=r.created_by===user.id||profile.role==='admin';return '<div class="panel"><b>'+safe(r.receipt_date)+' / '+r.quantity+' '+safe(selected.unit)+'</b><p class="muted">'+safe(r.person)+' '+safe(r.memo)+'</p>'+(allowed?'<button class="secondary" data-edit="'+safe(r.id)+'">修正</button><button class="danger" data-cancel="'+safe(r.id)+'">取消</button>':'<span class="muted">修正・取消権限なし</span>')+'</div>'}).join('')||'<p class="muted">受領履歴なし</p>'}
$('receiptHistory').onclick=async e=>{const id=e.target.dataset.edit||e.target.dataset.cancel;if(!id)return;const r=receipts.find(x=>x.id===id);if(!r)return;if(!(r.created_by===user.id||profile.role==='admin'))return note('権限がありません');try{if(e.target.dataset.cancel){if(!confirm('この架空の受領履歴を取り消しますか？'))return;const {error}=await db.rpc('cancel_receipt',{p_receipt_id:id});if(error)throw error}else{const q=prompt('修正後の受領数量（1以上）',r.quantity);if(q===null)return;if(!/^\d+$/.test(q)||Number(q)<1)return note('数量を確認してください');const d=prompt('修正後の受領日（YYYY-MM-DD）',r.receipt_date);if(d===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return note('日付を確認してください');const person=prompt('修正後の受領者名（架空）',r.person);if(person===null||!person.trim())return note('受領者名を確認してください');const memo=prompt('修正後のメモ',r.memo||'');if(memo===null)return;const {error}=await db.rpc('change_receipt',{p_receipt_id:id,p_quantity:Number(q),p_receipt_date:d,p_person:person.trim(),p_memo:memo});if(error)throw error}await load();openOrder(selected.id);note('更新しました',true)}catch(err){note('操作できません：'+err.message)}};
$('newReceipt').onsubmit=async e=>{e.preventDefault();if(!selected)return;const f=new FormData(e.target);const args={p_order_id:selected.id,p_quantity:Number(f.get('p_quantity')),p_receipt_date:f.get('p_receipt_date'),p_person:String(f.get('p_person')).trim(),p_memo:String(f.get('p_memo')||'')};if(!Number.isInteger(args.p_quantity)||args.p_quantity<1)return note('数量が正しくありません');try{const {error}=await db.rpc('add_receipt',args);if(error)throw error;await load();openOrder(selected.id);e.target.elements.p_quantity.value='';note('受領登録しました',true)}catch(err){note('受領登録できません：'+err.message)}};
$('newOrder').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const o=Object.fromEntries(f.entries());o.quantity=Number(o.quantity);if(!Number.isInteger(o.quantity)||o.quantity<1)return note('数量が正しくありません');for(const k of ['order_date','due_date'])if(!o[k])o[k]=null;o.created_by=user.id;try{const {error}=await db.from('orders').insert(o);if(error)throw error;e.target.reset();e.target.elements.request_date.value=today();await load();view('ordersPanel');note('赤伝を登録しました',true)}catch(err){note('赤伝を登録できません：'+err.message)}};
$('reload').onclick=async()=>{try{await load();note('一覧を更新しました',true)}catch(e){note(e.message)}};$('navOrders').onclick=()=>view('ordersPanel');$('navNew').onclick=()=>view('newPanel');document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&db&&user&&!$('ordersPanel').classList.contains('hidden'))load().catch(e=>note('更新できません：'+e.message))});boot();
</script></body></html>
