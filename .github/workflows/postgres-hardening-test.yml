name: Free isolated PostgreSQL hardening tests

on:
  push:
    branches:
      - feature/ver6-qr-enrollment-design
    paths:
      - 'tests/postgres/**'
      - 'supabase/migrations/20261029_order_quantity_guard_DRAFT.sql'
      - '.github/workflows/postgres-hardening-test.yml'
  pull_request:
    paths:
      - 'tests/postgres/**'
      - 'supabase/migrations/20261029_order_quantity_guard_DRAFT.sql'
      - '.github/workflows/postgres-hardening-test.yml'

permissions:
  contents: read

jobs:
  isolated-postgres-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-temporary
          POSTGRES_DB: akaden_isolated_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d akaden_isolated_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test-only-temporary
      PGDATABASE: akaden_isolated_test
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Create fictional fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/fixture.sql
      - name: Apply DRAFT hardening only to temporary database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_order_quantity_guard_DRAFT.sql
      - name: Run isolated SQL assertions
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/assertions.sql
