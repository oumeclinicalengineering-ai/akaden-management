name: Ver6 QR browser and API static checks
on:
  push:
    branches: [feature/ver6-qr-enrollment-design]
    paths:
      - 'ver6-qr-registration-dev.html'
      - 'vendor/qrcodejs/**'
      - 'supabase/functions/ver6-enrollment-api/**'
      - 'supabase/functions/ver6-face-to-face-enrollment/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/20261029_face_to_face_auth_claim_DRAFT.sql'
      - 'supabase/migrations/20261029_finalize_device_enrollment_DRAFT.sql'
      - 'supabase/migrations/20261029_enrollment_admin_views_DRAFT.sql'
      - 'supabase/migrations/20261029_admin_bootstrap_DRAFT.sql'
      - 'supabase/migrations/20261029_admin_device_recovery_DRAFT.sql'
      - 'supabase/migrations/20261029_device_sessions_DRAFT.sql'
      - 'scripts/check-qr-ui.mjs'
      - 'tests/edge/**'
      - '.github/workflows/qr-browser-check.yml'
  pull_request:
    paths:
      - 'ver6-qr-registration-dev.html'
      - 'vendor/qrcodejs/**'
      - 'supabase/functions/ver6-enrollment-api/**'
      - 'supabase/functions/ver6-face-to-face-enrollment/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/20261029_face_to_face_auth_claim_DRAFT.sql'
      - 'scripts/check-qr-ui.mjs'
      - 'tests/edge/**'
      - '.github/workflows/qr-browser-check.yml'
permissions:
  contents: read
jobs:
  check-browser-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check QR and OTP page syntax and safety markers
        run: node scripts/check-qr-ui.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.x'
      - name: Type-check staged Supabase Edge Function
        run: |
          deno check supabase/functions/ver6-enrollment-api/index.ts
          deno check supabase/functions/ver6-face-to-face-enrollment/index.ts
      - name: Run isolated anonymous API abuse and Auth tests (no network calls)
        run: deno test tests/edge/face_to_face_api_test.ts
