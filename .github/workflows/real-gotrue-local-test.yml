name: Ver6 real GoTrue isolated integration (no production)
on:
  push:
    branches: [feature/ver6-qr-enrollment-design]
    paths:
      - 'tests/auth/**'
      - '.github/workflows/real-gotrue-local-test.yml'
  pull_request:
    paths:
      - 'tests/auth/**'
      - '.github/workflows/real-gotrue-local-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-real-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.x'
      - name: Initialize disposable LOCAL Supabase project
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/akaden-ver6-real-auth"
          npx --yes supabase@2.122.0 --workdir "$RUNNER_TEMP/akaden-ver6-real-auth" init --yes
      - name: Start real GoTrue/Auth and PostgreSQL locally (Docker only)
        run: |
          set -eu
          npx --yes supabase@2.122.0 --workdir "$RUNNER_TEMP/akaden-ver6-real-auth" start --exclude studio,postgres-meta,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Read ONLY the disposable local connection parameters
        run: |
          set -eu
          npx --yes supabase@2.122.0 --workdir "$RUNNER_TEMP/akaden-ver6-real-auth" status -o env > "$RUNNER_TEMP/akaden-local-status.env"
          for pair in "API_URL LOCAL_API_URL" "ANON_KEY LOCAL_ANON_KEY" "SERVICE_ROLE_KEY LOCAL_SERVICE_ROLE_KEY" "DB_URL LOCAL_DB_URL"; do
            set -- $pair
            value="$(grep -m1 "^$1=" "$RUNNER_TEMP/akaden-local-status.env" | cut -d= -f2-)"
            value="$(printf '%s' "$value" | tr -d '"')"
            test -n "$value"
            printf '%s=%s\n' "$2" "$value" >> "$GITHUB_ENV"
          done
          rm -f "$RUNNER_TEMP/akaden-local-status.env"
      - name: Install PostgreSQL client if missing
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Create fake-only RLS probe (not production migrations)
        run: |
          set -eu
          case "$LOCAL_DB_URL" in
            postgresql://*@127.0.0.1:54322/*|postgres://*@127.0.0.1:54322/*) ;;
            *) echo 'REFUSED: non-local database'; exit 1 ;;
          esac
          psql "$LOCAL_DB_URL" -X -v ON_ERROR_STOP=1 -f tests/auth/local-auth-probe.sql
      - name: Load actual QR DRAFT RPCs in disposable database only
        run: |
          set -eu
          case "$LOCAL_DB_URL" in
            postgresql://*@127.0.0.1:54322/*|postgres://*@127.0.0.1:54322/*) ;;
            *) echo 'REFUSED: non-local database'; exit 1 ;;
          esac
          psql "$LOCAL_DB_URL" -X -v ON_ERROR_STOP=1 -f tests/auth/local-qr-chain.sql
      - name: Test actual generateLink -> verifyOtp -> RLS
        run: |
          export LOCAL_SESSION_IDS_FILE="$RUNNER_TEMP/akaden-real-auth-ids.txt"
          deno test --allow-env=LOCAL_API_URL,LOCAL_ANON_KEY,LOCAL_SERVICE_ROLE_KEY,LOCAL_SESSION_IDS_FILE --allow-net=127.0.0.1:54321 --allow-write="$LOCAL_SESSION_IDS_FILE" tests/auth/local-gotrue-integration.test.ts
      - name: Confirm actual auth.sessions DB row
        run: |
          set -eu
          ids="$RUNNER_TEMP/akaden-real-auth-ids.txt"
          uid="$(sed -n '1p' "$ids")"
          sid="$(sed -n '2p' "$ids")"
          printf '%s' "$uid" | grep -Eq '^[0-9a-f-]{36}$'
          printf '%s' "$sid" | grep -Eq '^[0-9a-f-]{36}$'
          count="$(psql "$LOCAL_DB_URL" -X -tA -v ON_ERROR_STOP=1 -v staff_uid="$uid" -v session_id="$sid" <<'SQL'
          SELECT count(*) FROM auth.sessions
          WHERE user_id = :'staff_uid'::uuid AND id = :'session_id'::uuid;
          SQL
          )"
          test "$count" = "1"
          echo 'PASS: Real GoTrue auth.sessions row belongs to the verified user.'
      - name: Destroy disposable stack, even after failure
        if: always()
        run: |
          npx --yes supabase@2.122.0 --workdir "$RUNNER_TEMP/akaden-ver6-real-auth" stop --no-backup || true
          rm -f "$RUNNER_TEMP/akaden-real-auth-ids.txt"
