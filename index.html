<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赤伝管理システム Ver.4（架空データ専用）</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#19324c;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}header{background:#1765b1;color:white;padding:17px 20px;font-size:21px;font-weight:700}main{max-width:1100px;margin:auto;padding:20px 16px 90px}.notice{background:#fff4d8;padding:12px;border-radius:10px;margin-bottom:16px;font-size:13px}.panel{background:white;border:1px solid #dce5f0;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #153f6a0a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.tile{padding:22px;background:#eaf3ff;border:1px solid #bdd9fb;border-radius:12px;text-align:left;cursor:pointer;color:#14599c;font-weight:700;font-size:17px}.tile small{display:block;font-size:12px;margin-top:8px;color:#52677a;font-weight:400}.primary,button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:#1765b1;color:white;font-weight:600}button.secondary{background:#eaf1fa;color:#14599c}button.danger{background:#a53642}input,select,textarea{width:100%;border:1px solid #c4d0dd;border-radius:8px;padding:10px;font:inherit;background:white}label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{margin:4px 0}.wide{grid-column:1/-1}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #e3eaf1;padding:12px 8px;text-align:left}th{background:#f3f7fc}.scroll{overflow-x:auto}.tag{border-radius:20px;padding:4px 9px;background:#e6f1ff;color:#1765b1;white-space:nowrap;font-size:12px}.warn{background:#fff0e9;color:#ad461b}.done{background:#e4f7ed;color:#187b4b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spaced{justify-content:space-between}.muted{color:#60758b;font-size:13px}.stats{font-size:32px;font-weight:800;color:#1765b1}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce5f0;display:flex;justify-content:center;z-index:10}nav button{background:white;color:#1765b1;border-radius:0;flex:1;max-width:250px;padding:16px 4px}nav button.active{background:#eaf3ff}h2{margin:0 0 16px}h3{margin:16px 0 10px}.hidden{display:none}#message{position:fixed;top:15px;right:15px;background:#173c60;color:white;padding:12px 16px;border-radius:10px;display:none;z-index:20;max-width:90vw}@media(max-width:650px){th,td{font-size:12px;padding:10px 5px}.panel{padding:13px}header{font-size:18px}}#modal:not(.hidden){position:fixed;inset:0;background:#122b46aa;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}#modal .dialog{background:white;border-radius:16px;padding:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 15px 55px #14283a55}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}.mini{font-size:12px;padding:7px 9px}.history-choice{border-bottom:1px solid #e3eaf1;padding:10px 0}.hint{background:#edf6ff;border-radius:8px;padding:10px;margin:12px 0}.datefilter{min-width:0}</style></head><body><header>赤伝管理システム <span style="font-size:12px;font-weight:400">Ver.4 / 復元安全性強化版</span></header><main><div class="notice">⚠️ この試作品は架空データ用です。データはこのブラウザー内にのみ保存され、他端末とは共有されません。OCRは実験機能です。認証・クラウド・自動バックアップは未実装です。画像の文字認識には外部配信のOCRライブラリを使用します。実際の赤伝画像や院内情報は入力しないでください。</div><section id="home"></section><section id="list" class="hidden"></section><section id="new" class="hidden"></section><section id="detail" class="hidden"></section><section id="settings" class="hidden"></section><div id="modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></main><nav><button onclick="go('home')" id="nav-home">ホーム</button><button onclick="go('list')" id="nav-list">物品一覧</button><button onclick="go('new')" id="nav-new">新規登録</button><button onclick="go('settings')" id="nav-settings">設定</button></nav><div id="message"></div><script>
const KEY='akaden-demo-v3';const demo=[{id:'AK-2026-001',requestDate:'2026-09-17',department:'架空部署A',name:'デモ用センサーA',maker:'架空メーカーA',model:'DEMO-A01',quantity:3,unit:'個',purpose:'デモ機器の保守用',orderDate:'2026-09-20',dueDate:'',receipts:[],deleted:false},{id:'AK-2026-002',requestDate:'2026-09-10',department:'架空部署B',name:'デモ用チューブB',maker:'架空メーカーB',model:'DEMO-B02',quantity:10,unit:'セット',purpose:'操作確認用',orderDate:'2026-09-12',dueDate:'',receipts:[{id:'r1',date:'2026-10-01',quantity:6,person:'スタッフA',memo:''}],deleted:false}];let state=JSON.parse(localStorage.getItem(KEY)||'null')||{items:demo,staff:['スタッフA','スタッフB']};let current=null;let receiptTarget=null;let pendingAction=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('sv-SE');const received=x=>x.receipts.reduce((n,r)=>n+Number(r.quantity),0);const pending=x=>Math.max(0,x.quantity-received(x));const status=x=>!x.orderDate?'発注待ち':received(x)>=x.quantity?'納品完了':received(x)>0?'一部納品':'納品待ち';const overdue=x=>!!x.orderDate&&pending(x)>0&&(new Date(today())-new Date(x.orderDate))/86400000>=60;const validDate=d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return false;let t=new Date(d+'T00:00:00');return !Number.isNaN(t.getTime())&&t.getFullYear()===Number(d.slice(0,4))&&t.getMonth()+1===Number(d.slice(5,7))&&t.getDate()===Number(d.slice(8,10))};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));function toast(s){$('message').textContent=s;$('message').style.display='block';setTimeout(()=>$('message').style.display='none',2600)}function go(page){for(let p of ['home','list','new','detail','settings'])$(p).classList.toggle('hidden',p!==page);for(let p of ['home','list','new','settings'])$('nav-'+p).classList.toggle('active',p===page);if(page==='home')home();if(page==='list')listing();if(page==='new')newForm();if(page==='settings')settings();window.scrollTo(0,0)}function home(){let active=state.items.filter(x=>!x.deleted&&x.orderDate&&pending(x)>0);$('home').innerHTML=`<div class="panel"><h2>ホーム</h2><div class="grid"><button class="tile" onclick="go('new')">📷 赤伝新規登録<small>写真選択・手入力</small></button><button class="tile" onclick="go('list')">📦 物品一覧<small>発注・受領状況を確認</small></button><button class="tile" onclick="go('list')">🗂 発注履歴<small>検索・Excel出力</small></button><button class="tile" onclick="go('settings')">⚙️ スタッフ管理<small>受領者を追加・編集</small></button></div></div><div class="panel"><div class="muted">納品待ち（分納中を含む）</div><div class="stats">${active.length}件</div><div class="muted">60日以上未納：${active.filter(overdue).length}件</div></div>`}function listing(){let options=['すべて','発注待ち','納品待ち','一部納品','納品完了'];$('list').innerHTML=`<div class="panel"><div class="row spaced"><h2>物品一覧・発注履歴</h2><button onclick="exportCSV()">CSV出力（試作）</button></div><div class="form"><div><label>品名・メーカー・規格を検索</label><input id="query" oninput="drawRows()" placeholder="検索"></div><div><label>状況</label><select id="filter" onchange="drawRows()">${options.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>要求日（開始）</label><input type="date" id="requestFrom" onchange="drawRows()"></div><div><label>要求日（終了）</label><input type="date" id="requestTo" onchange="drawRows()"></div><div><label>発注日（開始）</label><input type="date" id="orderFrom" onchange="drawRows()"></div><div><label>発注日（終了）</label><input type="date" id="orderTo" onchange="drawRows()"></div><div><label>表示</label><select id="deletedFilter" onchange="drawRows()"><option value="active">通常</option><option value="deleted">削除済み</option></select></div></div><div class="scroll" style="margin-top:16px"><table><thead><tr><th>管理番号</th><th>品名</th><th>メーカー・規格</th><th>要求日</th><th>発注日</th><th>受領/要求</th><th>状態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;drawRows()}function filtered(){let q=$('query').value.toLowerCase(),s=$('filter').value,del=$('deletedFilter').value==='deleted';let rf=$('requestFrom').value,rt=$('requestTo').value,of=$('orderFrom').value,ot=$('orderTo').value;return state.items.filter(x=>x.deleted===del&&(s==='すべて'||status(x)===s)&&[x.name,x.maker,x.model].some(v=>String(v).toLowerCase().includes(q))&&(!rf||x.requestDate>=rf)&&(!rt||x.requestDate<=rt)&&(!of||(x.orderDate&&x.orderDate>=of))&&(!ot||(x.orderDate&&x.orderDate<=ot)))}function drawRows(){$('rows').innerHTML=filtered().map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.maker)}<div class="muted">${esc(x.model)}</div></td><td>${esc(x.requestDate)}</td><td>${esc(x.orderDate)}</td><td>${received(x)}/${x.quantity} ${esc(x.unit)}</td><td><span class="tag ${overdue(x)?'warn':status(x)==='納品完了'?'done':''}">${overdue(x)?'⚠ 60日超過 / ':''}${status(x)}</span></td><td><button class="secondary mini" onclick="openItem('${x.id}')">詳細</button> ${!x.deleted&&pending(x)>0?`<button class="mini" onclick="quickReceipt('${x.id}')">受領登録</button>`:""}</td></tr>`).join('')||'<tr><td colspan="8">該当する物品はありません</td></tr>'}function field(name,label,value='',type='text',required=false){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></div>`}function newForm(){window.ocrUsed=false;let year=new Date().getFullYear();$('new').innerHTML=`<div class="panel"><h2>赤伝新規登録</h2><p class="muted">架空の赤伝画像を選択すると日本語OCRを試せます。認識結果は必ず確認・修正してください。初回はOCRデータの読み込みに時間がかかります。</p><label>赤伝の画像（架空データのみ）</label><input id="ocrImage" type="file" accept="image/*" capture="environment" onchange="previewOCR(event)"><div id="ocrPanel" class="panel" style="margin-top:12px;display:none"><img id="ocrPreview" alt="選択した赤伝画像" style="max-width:100%;max-height:240px;object-fit:contain"><p id="ocrStatus" class="muted"></p><button type="button" id="ocrStart" onclick="runOCR()">AI・OCRで読み取る</button><details style="margin-top:12px"><summary>認識した文字を確認</summary><textarea id="ocrRaw" rows="7" aria-label="認識結果"></textarea><button type="button" class="secondary" onclick="applyOCRText()">この文字から再入力</button></details></div><div class="hint"><strong>過去履歴から再利用</strong><p class="muted">品名で探して、メーカー・規格などを入力できます。過去の要求数量や日付は引き継ぎません。</p><div class="row"><input id="historyQuery" placeholder="過去の品名を検索" style="flex:1;min-width:160px" oninput="showHistory()"><button type="button" class="secondary" onclick="showHistory()">履歴検索</button></div><div id="historyResults"></div></div><form id="newForm" onsubmit="createItem(event)" style="margin-top:18px"><div class="form">${field('requestDate','要求日',today(),'date',true)}${field('department','所属部署','架空部署A')}${field('name','品名','','text',true)}${field('maker','メーカー')}${field('model','規格・型式')}${field('quantity','要求数量',1,'number',true)}${field('unit','単位','個')}${field('purpose','用途・購入理由')}${field('orderDate','発注日（発注済みの場合）','','date')}${field('dueDate','納品予定日（任意）','','date')}</div><p class="muted">保存前に入力内容の確認を表示します。</p><button type="submit" style="margin-top:12px">内容を確認して登録</button></form></div>`}let ocrFile=null;function previewOCR(e){ocrFile=e.target.files&&e.target.files[0];if(!ocrFile)return;$("ocrPanel").style.display="block";$("ocrStatus").textContent="画像を選択しました。文字認識はまだ実行されていません。";$("ocrPreview").src=URL.createObjectURL(ocrFile)}
async function runOCR(){if(!ocrFile)return alert("画像を選択してください");let b=$("ocrStart");b.disabled=true;$("ocrStatus").textContent="OCRを準備しています。初回は数十秒かかる場合があります。";try{if(!window.Tesseract){await new Promise((resolve,reject)=>{let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";s.onload=resolve;s.onerror=()=>reject(Error("OCRライブラリを取得できません。ネット接続を確認してください"));document.head.appendChild(s)})}let worker=await Tesseract.createWorker("jpn+eng",1,{logger:m=>{if(m.status)$("ocrStatus").textContent=m.status+" "+(m.progress?Math.round(m.progress*100)+"%":"")}});try{let result=await worker.recognize(ocrFile);$("ocrRaw").value=result.data.text||"";applyOCRText();$("ocrStatus").textContent="読み取りが完了しました。各項目を必ず確認・修正してから登録してください。";window.ocrUsed=true}finally{await worker.terminate()}}catch(err){$("ocrStatus").textContent="OCRを実行できませんでした: "+err.message+"。手入力は引き続き可能です。"}finally{b.disabled=false}}
function applyOCRText(){let text=$("ocrRaw").value||"";let f=$("newForm");if(!text.trim())return;const pick=(re)=>{let m=text.match(re);return m?m[1].trim().replace(/[：:]+$/,""):""};const set=(k,v)=>{if(v&&f.elements[k])f.elements[k].value=v};set("name",pick(/(?:品名|品\s*名)[\s:：]*([^\n]+)/));set("maker",pick(/(?:メーカー|製造元|製造会社)[\s:：]*([^\n]+)/));set("model",pick(/(?:規格[・･\/\s]*型式|規格|型式|品番)[\s:：]*([^\n]+)/));set("department",pick(/(?:所属部署|所属|部署)[\s:：]*([^\n]+)/));set("purpose",pick(/(?:用途|購入理由|使用目的)[\s:：]*([^\n]+)/));let q=pick(/(?:要求数量|数量|数\s*量)[\s:：]*([0-9０-９]+)/).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));if(q)set("quantity",q);set("unit",pick(/(?:単位)[\s:：]*([^\s\n]+)/));let d=text.match(/(20\d{2})[年\/.-]\s*(\d{1,2})[月\/.-]\s*(\d{1,2})/);if(d)set("requestDate",d[1]+"-"+d[2].padStart(2,"0")+"-"+d[3].padStart(2,"0"));$("ocrStatus").textContent="推定項目を入力しました。空欄・誤読があり得ます。画像と照合してください。"}
function createItem(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.quantity=Number(o.quantity);if(!Number.isInteger(o.quantity)||o.quantity<=0)return alert('要求数量は1以上の整数にしてください');if(!validDate(o.requestDate)||(o.orderDate&&!validDate(o.orderDate))||(o.dueDate&&!validDate(o.dueDate)))return alert('日付を確認してください');let match=state.items.filter(x=>!x.deleted&&x.name===o.name&&x.model===o.model&&x.requestDate===o.requestDate);return showConfirm('赤伝の登録内容を確認',`<p><b>品名：</b>${esc(o.name)}</p><p><b>メーカー・型式：</b>${esc(o.maker)} / ${esc(o.model)}</p><p><b>要求日・部署：</b>${esc(o.requestDate)} / ${esc(o.department)}</p><p><b>数量：</b>${o.quantity} ${esc(o.unit)}</p><p><b>発注日：</b>${esc(o.orderDate||'未登録')}</p>${match.length?'<p class="hint">同じ品名・規格・要求日の記録があります。重複に注意してください。</p>':''}`,()=>commitItem(o));}function commitItem(o){let year=(o.requestDate||today()).slice(0,4),nums=state.items.map(x=>x.id.match(new RegExp('^AK-'+year+'-(\\d+)$'))).filter(Boolean).map(x=>Number(x[1]));o.id=`AK-${year}-${String(Math.max(0,...nums)+1).padStart(3,'0')}`;o.receipts=[];o.deleted=false;o.ocrUnverified=!!window.ocrUsed;state.items.push(o);window.ocrUsed=false;save();toast('登録しました');openItem(o.id)}function openItem(id){current=id;detail();go('detail')}function detail(){let x=state.items.find(x=>x.id===current);if(!x)return go('list');let opts=state.staff.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');$('detail').innerHTML=`<div class="panel"><div class="row spaced"><h2>${esc(x.name)}</h2><span class="tag ${overdue(x)?'warn':''}">${status(x)}${overdue(x)?'・60日超過':''}</span></div><div class="muted">${esc(x.id)} / ${esc(x.maker)} / ${esc(x.model)}</div><p>要求：${x.quantity}${esc(x.unit)}　受領：${received(x)}${esc(x.unit)}　未納：${pending(x)}${esc(x.unit)}</p><p class="muted">要求日：${esc(x.requestDate)}　発注日：${esc(x.orderDate||'未登録')}　納品予定：${esc(x.dueDate||'未登録')}</p><div class="row"><button class="secondary" onclick="editItem()">発注情報を編集</button><button class="secondary" onclick="toggleDelete()">${x.deleted?'復元する':'削除済みにする'}</button><button class="secondary" onclick="go('list')">一覧へ戻る</button></div></div><div class="panel"><h3>受領登録</h3><form onsubmit="addReceipt(event)"><div class="form">${field('date','受領日',today(),'date',true)}${field('quantity','受領数量',pending(x),'number',true)}<div><label>受領者</label><select name="person" required>${opts}</select></div>${field('memo','備考（任意）')}</div><button style="margin-top:14px" ${x.deleted||pending(x)===0?'disabled':''}>確認して受領登録</button></form></div><div class="panel"><h3>受領履歴</h3><div class="scroll"><table><thead><tr><th>受領日</th><th>数量</th><th>受領者</th><th>備考</th><th>操作</th></tr></thead><tbody>${x.receipts.map(r=>`<tr><td>${esc(r.date)}</td><td>${r.quantity}${esc(x.unit)}</td><td>${esc(r.person)}</td><td>${esc(r.memo)}</td><td><button class="secondary" onclick="editReceipt('${r.id}')">修正</button> <button class="danger" onclick="deleteReceipt('${r.id}')">削除</button></td></tr>`).join('')||'<tr><td colspan="5">受領履歴はありません</td></tr>'}</tbody></table></div></div>`}function addReceipt(e){e.preventDefault();let x=state.items.find(x=>x.id===current),o=Object.fromEntries(new FormData(e.target));o.quantity=Number(o.quantity);if(!validDate(o.date)||!o.person||!Number.isInteger(o.quantity)||o.quantity<=0||o.quantity>pending(x))return alert('受領日・受領者・数量を確認してください');showReceiptConfirm(x,o,()=>{o.id='r'+Date.now()+'-'+Math.random().toString(36).slice(2,6);x.receipts.push(o);save();detail();toast('受領を登録しました')})}function editReceipt(id){let x=state.items.find(x=>x.id===current),r=x.receipts.find(r=>r.id===id);let date=prompt('受領日（YYYY-MM-DD）',r.date);if(date===null)return;let n=prompt('受領数量',r.quantity);if(n===null)return;n=Number(n);if(!validDate(date)||!Number.isInteger(n)||n<1||n>x.quantity-received(x)+Number(r.quantity))return alert('日付または数量が不正です');let p=prompt('受領者',r.person);if(p===null)return;if(!confirm('受領履歴を修正しますか？'))return;Object.assign(r,{date,quantity:n,person:p});save();detail()}function deleteReceipt(id){if(!confirm('この受領履歴を削除しますか？'))return;let x=state.items.find(x=>x.id===current);x.receipts=x.receipts.filter(r=>r.id!==id);save();detail()}function editItem(){let x=state.items.find(x=>x.id===current);let order=prompt('発注日（空欄で発注待ち、YYYY-MM-DD）',x.orderDate||'');if(order===null)return;if(order&&!validDate(order))return alert('日付形式が不正です');let due=prompt('納品予定日（任意）',x.dueDate||'');if(due===null)return;if(due&&!validDate(due))return alert('日付形式が不正です');if(!confirm('変更を保存しますか？'))return;x.orderDate=order;x.dueDate=due;save();detail()}function toggleDelete(){let x=state.items.find(x=>x.id===current);if(!confirm(x.deleted?'復元しますか？':'削除済みにして通常一覧から非表示にしますか？'))return;x.deleted=!x.deleted;save();go('list')}function settings(){$('settings').innerHTML=`<div class="panel"><h2>スタッフ管理</h2><div>${state.staff.map((s,i)=>`<div class="row" style="padding:7px 0">${esc(s)} <button class="secondary" onclick="renameStaff(${i})">編集</button><button class="danger" onclick="removeStaff(${i})">削除</button></div>`).join('')}</div><div class="row" style="margin-top:12px"><input id="staffName" placeholder="新しいスタッフ名" style="max-width:250px"><button onclick="addStaff()">追加</button></div></div><div class="panel"><h2>データ保存（試作）</h2><p class="muted">この端末のブラウザーにのみ保存されます。JSON形式の手動バックアップと検証付き復元を試せます。復元時は内容を検査し、不正なファイルは既存データを変更せず拒否します。自動バックアップは未実装です。</p><button onclick="backup()">JSONバックアップを保存</button><label style="margin-top:15px">JSONバックアップを復元</label><input type="file" accept="application/json" onchange="restore(event)"><p><button class="danger" onclick="resetDemo()">試作データを初期化</button></p></div>`}function addStaff(){let n=$('staffName').value.trim();if(!n)return;if(state.staff.includes(n))return alert('登録済みです');state.staff.push(n);save();settings()}function renameStaff(i){let n=prompt('スタッフ名',state.staff[i]);if(!n||!n.trim())return;state.staff[i]=n.trim();save();settings()}function removeStaff(i){if(!confirm('スタッフ一覧から削除しますか？過去の受領記録は残ります。'))return;state.staff.splice(i,1);save();settings()}function download(content,name,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){download(JSON.stringify(state,null,2),'akaden-demo-backup.json','application/json')}const RESTORE_MAX_BYTES=5*1024*1024;
function validateBackup(data){
 const fail=msg=>{throw Error(msg)};
 const record=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
 const str=(v,max=500)=>typeof v==='string'&&v.length<=max;
 const optDate=v=>v===''||validDate(v);
 if(!record(data)||!Array.isArray(data.items)||!Array.isArray(data.staff))fail('バックアップの基本形式が正しくありません');
 if(data.items.length>10000||data.staff.length>1000)fail('登録件数が上限を超えています');
 if(!data.staff.every(v=>str(v,100)&&v.trim()))fail('スタッフ名が不正です');
 if(new Set(data.staff).size!==data.staff.length)fail('スタッフ名が重複しています');
 const ids=new Set();const normalized=[];
 for(const [i,x] of data.items.entries()){
  const prefix=`物品${i+1}`;
  if(!record(x))fail(prefix+'の形式が不正です');
  if(!str(x.id,100)||!x.id.trim()||ids.has(x.id))fail(prefix+'の管理番号が不正または重複しています');
  ids.add(x.id);
  for(const key of ['department','name','maker','model','unit','purpose'])if(!str(x[key],500))fail(prefix+'の'+key+'が不正です');
  if(!x.name.trim())fail(prefix+'の品名が空欄です');
  if(!validDate(x.requestDate)||!optDate(x.orderDate)||!optDate(x.dueDate))fail(prefix+'の日付が不正です');
  if(!Number.isSafeInteger(x.quantity)||x.quantity<1||x.quantity>100000000)fail(prefix+'の要求数量が不正です');
  if(typeof x.deleted!=='boolean'||!Array.isArray(x.receipts)||x.receipts.length>10000)fail(prefix+'の状態・受領履歴が不正です');
  const receiptIds=new Set();let total=0;
  const receipts=x.receipts.map((r,j)=>{
   if(!record(r)||!str(r.id,100)||!r.id||receiptIds.has(r.id))fail(prefix+'の受領履歴番号が不正です');
   receiptIds.add(r.id);
   if(!validDate(r.date)||!Number.isSafeInteger(r.quantity)||r.quantity<1||!str(r.person,100)||!r.person.trim()||!str(r.memo,2000))fail(prefix+'の受領履歴'+(j+1)+'が不正です');
   total+=r.quantity;
   return {id:r.id,date:r.date,quantity:r.quantity,person:r.person,memo:r.memo};
  });
  if(total>x.quantity)fail(prefix+'の受領合計が要求数量を超えています');
  normalized.push({id:x.id,requestDate:x.requestDate,department:x.department,name:x.name,maker:x.maker,model:x.model,quantity:x.quantity,unit:x.unit,purpose:x.purpose,orderDate:x.orderDate,dueDate:x.dueDate,receipts,deleted:x.deleted,ocrUnverified:x.ocrUnverified===true});
 }
 return {items:normalized,staff:[...data.staff]};
}
async function restore(e){
 const file=e.target.files&&e.target.files[0];if(!file)return;
 try{
  if(file.size>RESTORE_MAX_BYTES)throw Error('ファイルが大きすぎます（上限5MB）');
  const data=validateBackup(JSON.parse(await file.text()));
  if(!confirm(`検証済みの物品${data.items.length}件・スタッフ${data.staff.length}名で、現在の試作データを上書きしますか？`))return;
  localStorage.setItem(KEY,JSON.stringify(data));
  state=data;go('home');toast('バックアップを安全に復元しました');
 }catch(err){alert('復元できませんでした。既存データは変更していません。\\n'+(err instanceof Error?err.message:'形式を確認してください'))}
 finally{e.target.value=''}
}function resetDemo(){if(!confirm('試作データを初期状態に戻しますか？'))return;state={items:structuredClone(demo),staff:['スタッフA','スタッフB']};save();go('home')}function showConfirm(title,body,action){pendingAction=action;$('modal').innerHTML=`<div class="dialog"><h2 id="modalTitle">${esc(title)}</h2><div>${body}</div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">戻って修正</button><button type="button" onclick="acceptModal()">確認して保存</button></div></div>`;$('modal').classList.remove('hidden')}
function closeModal(){pendingAction=null;$('modal').classList.add('hidden');$('modal').innerHTML=''}
function acceptModal(){let a=pendingAction;closeModal();if(a)a()}
function showReceiptConfirm(x,o,action){showConfirm('受領登録の最終確認',`<p><b>物品：</b>${esc(x.name)}（${esc(x.id)}）</p><p><b>受領日：</b>${esc(o.date)}</p><p><b>数量：</b>${o.quantity} ${esc(x.unit)}</p><p><b>受領者：</b>${esc(o.person)}</p><p><b>メモ：</b>${esc(o.memo||'なし')}</p><p class="hint">登録後の未納数量：${pending(x)-o.quantity} ${esc(x.unit)}</p>`,action)}
function quickReceipt(id){let x=state.items.find(i=>i.id===id);if(!x||x.deleted||pending(x)<=0)return;let options=state.staff.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');$('modal').innerHTML=`<div class="dialog"><h2 id="modalTitle">一覧から受領登録</h2><p>${esc(x.name)} / 未納 ${pending(x)} ${esc(x.unit)}</p><form id="quickForm"><div class="form">${field('date','受領日',today(),'date',true)}${field('quantity','受領数量',pending(x),'number',true)}<div><label>受領者</label><select name="person" required>${options}</select></div>${field('memo','メモ')}</div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">キャンセル</button><button type="submit">内容を確認</button></div></form></div>`;$('modal').classList.remove('hidden');$('quickForm').addEventListener('submit',e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.quantity=Number(o.quantity);if(!validDate(o.date)||!o.person||!Number.isInteger(o.quantity)||o.quantity<1||o.quantity>pending(x))return alert('受領日・受領者・数量（未納以下）を確認してください');closeModal();showReceiptConfirm(x,o,()=>{o.id='r'+Date.now()+'-'+Math.random().toString(36).slice(2,6);x.receipts.push(o);save();listing();toast('受領を登録しました')})})}
function showHistory(){let q=($('historyQuery').value||'').trim().toLowerCase(),area=$('historyResults');if(!q){area.innerHTML='';return}let matches=[...state.items].filter(x=>!x.deleted&&x.name.toLowerCase().includes(q)).reverse().slice(0,8);area.innerHTML=matches.map(x=>`<div class="history-choice"><b>${esc(x.name)}</b><div class="muted">${esc(x.maker)} / ${esc(x.model)} / ${esc(x.requestDate)}</div><button type="button" class="secondary mini" onclick="reuseHistory('${x.id}')">この情報を再利用</button></div>`).join('')||'<p class="muted">該当する履歴はありません</p>'}
function reuseHistory(id){let x=state.items.find(v=>v.id===id);if(!x)return;let f=$('newForm');for(let k of ['name','maker','model','unit','purpose','department'])if(f.elements[k])f.elements[k].value=x[k]||'';toast('過去の物品情報を入力しました。内容を確認してください')}
function exportCSV(){let lines=[['管理番号','要求日','所属','品名','メーカー','規格','要求数量','単位','発注日','納品予定日','受領数量','未納数量','状況'],...filtered().map(x=>[x.id,x.requestDate,x.department,x.name,x.maker,x.model,x.quantity,x.unit,x.orderDate,x.dueDate,received(x),pending(x),status(x)])];let csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,'\'$&').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(csv,'akaden-demo.csv','text/csv;charset=utf-8')}go('home');</script></body></html>
